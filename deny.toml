[graph]
targets = []

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
# Duplicate versions are allowed: the ratatui ecosystem pulls parallel
# major versions transitively (crossterm 0.28/0.29, rustix 0.38/1.x,
# linux-raw-sys) that we cannot unify from here. Verified 2026-10-31:
# removing this surfaces only those warnings, no direct-dep duplicates.
# Revisit if a *direct* dependency ever duplicates.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
