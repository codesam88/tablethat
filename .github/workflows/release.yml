name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Tags bypass CI (which runs on branch pushes/PRs), so gate the release
  # on the same checks here: nothing ships red.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install just and uv
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just,uv

      - name: Add Rust components
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Tag builds must not save caches (poisoning); read-only is safe
          # because shipped artifacts come from the cache-less build job.
          lookup-only: true

      - name: Check (format + clippy)
        run: just check

      - name: Test
        run: just test

      - name: Install audit tools
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit
        run: just audit

  build:
    needs: verify
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        run: |
          rm -rf pkg && mkdir -p pkg/tablethat
          cp target/${{ matrix.target }}/release/plan target/${{ matrix.target }}/release/gloss pkg/tablethat/
          cp README.md LICENSE-MIT LICENSE-APACHE plan.toml.example pkg/tablethat/
          cp -r themes pkg/tablethat/
          cp packaging/Makefile pkg/tablethat/
          tar czf tablethat-${{ matrix.target }}.tar.gz -C pkg tablethat

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tablethat-${{ matrix.target }}
          path: tablethat-${{ matrix.target }}.*

  package:
    needs: verify
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            nfpm_arch: x86_64
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            nfpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build distro binaries
        run: cargo build --release

      - name: Build static binaries
        env:
          # musl-gcc links dynamically by default; force static output.
          RUSTFLAGS: "-C link-arg=-static"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assert static linking
        run: |
          file target/${{ matrix.target }}/release/plan
          file target/${{ matrix.target }}/release/gloss
          file target/${{ matrix.target }}/release/plan | grep -Eq "statically linked|static-pie linked"
          file target/${{ matrix.target }}/release/gloss | grep -Eq "statically linked|static-pie linked"

      - name: Stage binaries
        run: |
          mkdir -p pkg-bin
          cp target/${{ matrix.target }}/release/plan target/${{ matrix.target }}/release/gloss pkg-bin/

      - name: Install nfpm
        run: |
          curl -sL -o /tmp/nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_${{ matrix.nfpm_arch }}.tar.gz
          tar xzf /tmp/nfpm.tar.gz -C /tmp
          sudo install -m755 /tmp/nfpm /usr/local/bin/nfpm

      - name: Build deb and rpm
        run: |
          conf=nfpm.yaml; [ "${{ matrix.arch }}" = arm64 ] && conf=nfpm-arm64.yaml
          VERSION="${GITHUB_REF#refs/tags/v}" nfpm package --config "$conf" --packager deb
          VERSION="${GITHUB_REF#refs/tags/v}" nfpm package --config "$conf" --packager rpm
          dpkg-deb --field tablethat_*.deb Package Version Architecture
          ls -la tablethat_*.deb tablethat-*.rpm

      - name: Package static tarball
        run: |
          rm -rf static && mkdir -p static/tablethat
          cp pkg-bin/plan pkg-bin/gloss static/tablethat/
          cp README.md LICENSE-MIT LICENSE-APACHE plan.toml.example packaging/Makefile static/tablethat/
          cp -r themes static/tablethat/
          tar czf tablethat-${{ matrix.target }}.tar.gz -C static tablethat

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tablethat-packages-${{ matrix.arch }}
          path: |
            tablethat_*.deb
            tablethat-*.rpm
            tablethat-*.tar.gz

  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true

      - name: Checksums
        run: |
          sha256sum tablethat-*.tar.gz tablethat_*.deb tablethat-*.rpm > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            tablethat-*.tar.gz
            tablethat_*.deb
            tablethat-*.rpm
            SHA256SUMS.txt
