name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".plan/*.md"
  pull_request:
    paths-ignore:
      - "*.md"
      - ".plan/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just

      - name: Add Rust components
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check (format + clippy)
        run: just check

      - name: Test
        run: just test

      - name: Smoke test
        run: just smoke

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.89 --profile minimal

      - name: Test on MSRV
        run: cargo +1.89 test
