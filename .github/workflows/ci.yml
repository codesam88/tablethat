name: CI

permissions:
  contents: read

# NOTE: no path filters — all jobs are required status checks, and a
# filtered-out workflow never reports, which would block every PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install just and uv
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: just,uv

      - name: Add Rust components
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check (format + clippy)
        run: just check

      - name: Test
        run: just test

      - name: Smoke test
        run: just smoke
