name: Workflow lint

permissions:
  contents: read

# NOTE: no path filters — zizmor is a required status check, and a
# filtered-out workflow never reports, which would block every PR.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install just and uv
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just,uv

      - name: Lint workflows
        run: just zizmor-check
