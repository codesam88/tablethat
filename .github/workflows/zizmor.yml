name: Workflow lint

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: zizmor

      - name: Lint workflows
        run: just zizmor-check
