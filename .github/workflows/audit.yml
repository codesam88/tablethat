name: Security audit

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/deny.toml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/deny.toml"
  schedule:
    - cron: "0 6 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just,cargo-audit,cargo-deny

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run audits
        run: just audit
