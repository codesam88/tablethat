# tablethat system packages (deb + rpm) from distro-native gnu binaries.
# Built in CI: VERSION is supplied by the workflow (release tag for stable
# releases; last stable release + head.<short sha> for rolling builds).
# This file is amd64; nfpm-arm64.yaml is the arm64 twin (keep in sync).
name: tablethat
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: codesam <tedsamhain@gmail.com>
description: plan + gloss — task management and markdown viewing
homepage: https://github.com/codesam88/tablethat
license: MIT OR Apache-2.0
contents:
  - src: pkg-bin/plan
    dst: /usr/bin/plan
    type: file
    file_info: { mode: 0755 }
  - src: pkg-bin/gloss
    dst: /usr/bin/gloss
    type: file
    file_info: { mode: 0755 }
  - src: themes/
    dst: /usr/share/tablethat/themes
    type: tree
  - src: README.md
    dst: /usr/share/doc/tablethat/README.md
  - src: plan.toml.example
    dst: /usr/share/doc/tablethat/plan.toml.example
  - src: LICENSE-MIT
    dst: /usr/share/doc/tablethat/LICENSE-MIT
  - src: LICENSE-APACHE
    dst: /usr/share/doc/tablethat/LICENSE-APACHE
